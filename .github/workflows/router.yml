name: Router validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      # Adapter repositories are independent and not published/submodules yet.
      # Root CI checks dispatcher/policy with boundary fixtures. Full adapter
      # compatibility and wheel builds run in the populated local workspace.
      - run: uv sync --frozen --no-install-project --extra tui
      - run: uv run --no-sync ruff check src scripts tests example
      - run: uv run --no-sync ruff format --check src scripts tests example
      - run: uv run --no-sync pytest -q
