[project]
name = "litellm-acp-router"
version = "0.1.0"
description = "Deployment workspace for isolated LiteLLM agent CLI backends"
requires-python = ">=3.11,<3.14"
dependencies = ["litellm[proxy]==1.109.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
